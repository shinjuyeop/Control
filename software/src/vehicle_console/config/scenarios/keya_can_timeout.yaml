name: keya_can_timeout
# 전제조건(주입 전 정상 상태 확인)이 있는 구조다. estop_test.yaml 주석 참고.
# 이 시나리오가 그 사례였다: 2026-08-19에 can0 어댑터 USB 경로가 죽어
# can_timeout이 처음부터 true였는데도 구판(전제 없음)은 PASS로 판정했다.
steps:
  - at: 0.0
    hil:
      mode: AUTO
      steering_position: 0
    fault:
      keya_drop_tx: false
    command:
      enabled: true
      speed_target_mps: 0.0
      steering_target_rad: 0.10
      brake_engage: false
  - at: 4.0
    fault:
      keya_drop_tx: true
expect:
  # 전제: 주입 전에 KEYA 통신이 실제로 성립해 있어야 한다.
  - topic: /steering/status
    field: can_timeout
    equals: false
    after: 1.0
    within_ms: 2800
  - topic: /steering/status
    field: can_timeout
    equals: true
    after: 4.0
    within_ms: 700
