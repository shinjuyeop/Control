# A12 — AUTO small-angle steering sine
#
# MANUAL에서 직진·약 1.0 m/s로 맞춘 뒤 AUTO로 전환한다.
# center에서 5 s 유지한 뒤 center±1 deg, period 8 s sine을 6주기 실행하고,
# 끝나면 center·1.0 m/s를 계속 유지한다. MANUAL 전환 후 정지하고 Ctrl+C.
# 현재 center=-2 deg는 어제 실차 직진 추정값이다. 얼라인먼트 후에는 이 YAML의
# steering_center_deg만 수정한다.
vehicle_test_scenario_runner:
  ros__parameters:
    enabled: true
    wait_for_auto_mode: true
    command_topic: /planning/command
    drive_status_topic: /drive/status
    publish_rate_hz: 20.0

    scenario: steering_sweep
    cruise_speed_kph: 3.6    # 1.0 m/s
    steering_center_deg: -2.0
    steering_amplitude_deg: 1.0
    steering_period_sec: 8.0
    initial_hold_sec: 5.0
    scenario_repetitions: 6
    brake_override: false
