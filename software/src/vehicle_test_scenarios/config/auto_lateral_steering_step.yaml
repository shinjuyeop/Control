# A11 — AUTO center-region steering step
#
# MANUAL 정지 상태에서 AUTO로 전환한다. AUTO 감지 후 10 s 동안
# speed_target=0.0 m/s, brake=false를 발행한 뒤 설정한 목표속도를 명령한다.
# 각 조향 phase는 5 s: center → center+1 deg → center → center-1 deg.
# 이 20 s cycle을 3회 반복한 뒤 speed_target=0.0 m/s·center를 유지한다.
# 기본 목표속도와 센터각은 0이다. 시험 조건에 맞게 이 YAML에서 설정한다.
vehicle_test_scenario_runner:
  ros__parameters:
    enabled: true
    wait_for_auto_mode: true
    auto_start_delay_sec: 10.0  # AUTO 감지 후 speed_target=0, brake=false countdown
    command_topic: /planning/command
    drive_status_topic: /drive/status
    scenario_status_topic: /sysid/scinario
    scenario_label: A11_steering_step_center_pm1
    publish_rate_hz: 20.0

    scenario: steering_step
    cruise_speed_kph: 0.0    # 시험할 목표속도를 입력한다.
    steering_center_deg: 0.0
    steering_amplitude_deg: 1.0
    steering_step_interval_sec: 5.0
    scenario_repetitions: 3  # 좌·우 step cycle 3회
    initial_hold_sec: 0.0    # countdown 후 center/설정속도 phase 5 s
    brake_override: false
