name: estop_test
steps:
  - at: 0.0
    hil:
      mode: AUTO
      gear: FORWARD
      estop_dashboard: false
    command:
      enabled: true
      speed_target_mps: 2.0
      steering_target_rad: 0.0
      brake_engage: false
  - at: 2.0
    hil:
      estop_dashboard: true
expect:
  - topic: /brake/status
    field: brake_commanded
    equals: true
    after: 2.0
    within_ms: 500
  - topic: /brake/status
    field: stop_reason_bits
    bitmask: 0x04
    after: 2.0
    within_ms: 500
