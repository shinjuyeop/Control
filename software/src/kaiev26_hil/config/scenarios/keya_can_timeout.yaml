name: keya_can_timeout
steps:
  - at: 0.0
    hil:
      mode: AUTO
      steering_position: 0
    fault:
      keya_drop_tx: false
    command:
      enabled: true
      speed_target_mps: 0.0
      steering_target_rad: 0.10
      brake_engage: false
  - at: 2.0
    fault:
      keya_drop_tx: true
expect:
  - topic: /steering/status
    field: can_timeout
    equals: true
    after: 2.0
    within_ms: 700
