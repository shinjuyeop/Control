name: ez_can_timeout
steps:
  - at: 0.0
    hil:
      mode: AUTO
      speed: 1.0
    fault:
      ez_drop_tx: false
    command:
      enabled: true
      speed_target_mps: 2.0
      steering_target_rad: 0.0
      brake_engage: false
  - at: 2.0
    fault:
      ez_drop_tx: true
expect:
  # STM_A currently exposes the 200 ms Part-I timeout as validity only.
  - topic: /drive/status
    field: part1_valid
    equals: false
    after: 2.0
    within_ms: 500
