steering_actuator_node:
  ros__parameters:
    can_interface: "can0"
    node_id: 1
    # Startup-only: position requires KEYA 0020=3; torque requires 0020=2.
    # Host never sets the KEYA work mode. Verify Direction=0 and LEFT sign unloaded.
    actuation_mode: "torque"  # "position" | "torque"
    torque_direction_sign: 1
    # Display-only conversion for KEYA manual §4.3.3.2; must match Parameter 0003.
    keya_protection_current_a: 20.0
    torque_control_period_ms: 20
    torque_feedback_timeout_ms: 100
    # High stiffness: P reaches peak at 0.5 deg. Raw limits are NOT an Amp conversion.
    torque_full_scale_error_deg: 0.5
    torque_kd: 1500.0  # raw / (rad/s)
    torque_peak_limit_raw: 10000
    torque_sustained_limit_raw: 5000
    torque_peak_duration_ms: 5000
    torque_peak_recovery_ms: 5000
    torque_settle_angle_deg: 0.05
    torque_settle_rate_deg_s: 0.5
    torque_rate_filter_hz: 10.0
    torque_soft_limit_margin_deg: 1.0
    control_period_ms: 20
    can_timeout_ms: 500
    feedback_timeout_ms: 500
    mode_timeout_ms: 1500
    drive_status_timeout_ms: 500
    steer_command_timeout_ms: 200
    max_steering_rate_deg_s: 60.0
    # Temporary: allow steering at standstill. Restore to 1.0 after this session.
    minimum_steering_speed_kph: 0.0

    hardware_can_enabled: true
    actuator_output_enabled: true
    tracking_control_enabled: false
    test_input_injection_enabled: false
