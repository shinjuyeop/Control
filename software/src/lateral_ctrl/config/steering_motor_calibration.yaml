# KEYA raw encoder count to central-equivalent Ackermann steering angle.
# Control, HIL, and the Gazebo CAN bridge share this calibration:
#
#   v = motor_position_count / count_scale
#   equivalent_deg = k1 * v + k3 * v^3 + k5 * v^5
#
# Positive count and positive angle mean left turn. Commands are limited to the
# symmetric measured count range; feedback conversion is not clamped.
revision: "keya-steering-20260810-r2"
count_scale: 3500.0
equivalent_k1_deg: 46.79149152
equivalent_k3_deg: -39.22366242
equivalent_k5_deg: 22.73814759
command_count_limit: 3321
# Raw motor-axis diagnostic conversion only.
counts_per_rev: 10000.0
