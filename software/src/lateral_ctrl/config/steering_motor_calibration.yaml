# KEYA raw encoder count to central-equivalent Ackermann steering angle.
# Control, HIL, and the Gazebo CAN bridge share this calibration:
#
#   v = motor_position_count / count_scale
#   equivalent_deg = k1*v + k2*v^2 + k3*v^3 + k4*v^4 + k5*v^5
#
# Positive count and positive angle mean left turn. The nominal-centered curve
# fits the 2026-09-19 left/right wheel-hub gyro-integral Ackermann equivalent
# over -5357..5357 count (max fit error 0.050 deg). K-City body-IMU/GNSS
# curvature is a separate driving cross-check, not absolute toe calibration.
# The command limit is inside the observed -5480..5357 count range; feedback
# is not clamped. Recorded extrema do not establish mechanical stop clearance.
revision: "keya-steering-20260919-gyro-r1"
count_scale: 3500.0
equivalent_k1_deg: 20.801783967214856
equivalent_k2_deg: -0.016893521554765867
equivalent_k3_deg: -7.409984217512384
equivalent_k4_deg: -0.02066649605375595
equivalent_k5_deg: 2.8146092208162923
command_count_limit: 5300
# Raw motor-axis diagnostic conversion only.
counts_per_rev: 10000.0
