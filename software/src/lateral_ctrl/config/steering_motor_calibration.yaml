# KEYA raw encoder count to central-equivalent Ackermann steering angle.
# Control, HIL, and the Gazebo CAN bridge share this calibration:
#
#   v = motor_position_count / count_scale
#   equivalent_deg = k1*v + k2*v^2 + k3*v^3 + k4*v^4 + k5*v^5
#
# Positive count and positive angle mean left turn. This nominal-centered shape
# comes from direct left/right wheel-hub IMU measurements; it is not absolute
# toe or mounting-yaw calibration. Commands stay inside the measured count
# range, while feedback conversion is not clamped.
revision: "keya-steering-20260821-r3"
count_scale: 3500.0
equivalent_k1_deg: 45.36712598527852
equivalent_k2_deg: -3.534573536433758
equivalent_k3_deg: -44.4281013734926
equivalent_k4_deg: 2.7876017898037944
equivalent_k5_deg: 28.96220619772027
command_count_limit: 3279
# Raw motor-axis diagnostic conversion only.
counts_per_rev: 10000.0
